<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاقن الروابط الداخلي الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 p-4 md:p-8">
    <div class="max-w-3xl mx-auto bg-white p-6 md:p-8 rounded-xl shadow-md">
        <h1 class="text-2xl font-bold mb-2 text-center text-blue-700">🎯 حاقن الروابط الداخلية الذكي (إصدار الدقة والمرونة)</h1>
        <p class="text-sm text-gray-500 text-center mb-6">مطابقة دلالية مرنة (من كلمتين إلى 5 كلمات) متوافقة 100% مع منصات زد وسلة وووردبريس</p>

        <div class="space-y-4">
            <!-- 1. مفتاح الـ API -->
            <div>
                <label class="block text-sm font-semibold mb-1">مفتاح Google AI Studio API Key:</label>
                <div class="flex gap-2">
                    <input type="password" id="apiKey" placeholder="AIzaSy..." class="w-full border p-2 rounded focus:outline-blue-500 font-mono text-sm">
                    <button onclick="loadUserModels()" class="bg-gray-800 hover:bg-black text-white px-3 py-2 rounded text-xs whitespace-nowrap">🔄 فحص النماذج</button>
                </div>
                <span class="text-xs text-gray-500">يُحفظ بأمان في متصفحك تلقائياً.</span>
            </div>

            <!-- 2. الموديل -->
            <div>
                <label class="block text-sm font-semibold mb-1">🤖 الموديل المستخدم:</label>
                <select id="modelSelect" class="w-full border p-2 rounded focus:outline-blue-500 bg-white text-sm font-mono">
                    <option value="models/gemini-3.1-flash-lite" selected>⚡ models/gemini-3.1-flash-lite (افتراضي)</option>
                </select>
                <span id="modelStatus" class="text-xs text-blue-600 mt-1 block"></span>
            </div>

            <!-- 3. روابط الخرائط -->
            <div>
                <label class="block text-sm font-semibold mb-1">🗺️ روابط خرائط الموقع (Sitemaps):</label>
                <textarea id="sitemapUrls" rows="3" placeholder="ضع رابط خريطة الموقع هنا (مثال: https://midhal-oud.store/sitemap.xml)" class="w-full border p-2 rounded focus:outline-blue-500 font-mono text-sm"></textarea>
            </div>

            <!-- 4. رفع الملفات -->
            <div>
                <label class="block text-sm font-semibold mb-1">📁 ارفع ملفات المقالات (صيغة .txt):</label>
                <input type="file" id="articleFiles" multiple accept=".txt" class="w-full border p-2 rounded bg-gray-50 text-sm cursor-pointer file:mr-4 file:py-1 file:px-3 file:rounded file:border-0 file:bg-blue-600 file:text-white file:text-xs hover:file:bg-blue-700">
                <span id="fileCount" class="text-xs text-gray-500 mt-1 block">لم يتم اختيار أي ملفات بعد.</span>
            </div>

            <button onclick="startBatchProcessing()" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition duration-200">
                🚀 ابدأ فحص وحقن الروابط الآن
            </button>
        </div>

        <!-- صندوق حالة التقدم -->
        <div id="statusContainer" class="mt-6 hidden">
            <div class="flex justify-between text-sm font-semibold mb-1">
                <span id="statusText">جاري المعالجة...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-3">
                <div id="progressBar" class="bg-blue-600 h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
            <div id="logMessage" class="mt-2 text-xs text-gray-600"></div>

            <!-- تقرير حي ومفصل لكل مقال -->
            <div class="mt-4 bg-gray-50 border p-3 rounded text-xs max-h-60 overflow-y-auto">
                <p class="font-bold text-gray-700 mb-1">📋 تقرير المعالجة المباشر:</p>
                <ul id="injectedReport" class="space-y-1 text-gray-600"></ul>
            </div>
        </div>

        <!-- صندوق التنزيل -->
        <div id="downloadContainer" class="mt-6 p-4 bg-green-50 border border-green-200 rounded-lg text-center hidden">
            <h3 class="text-green-800 font-bold mb-2">🎉 تم الانتهاء بنجاح وحقن الروابط!</h3>
            <button onclick="downloadZip()" class="bg-green-600 hover:bg-green-700 text-white font-bold px-6 py-2 rounded-lg text-sm transition">
                📥 تحميل المقالات المعالجة (ZIP)
            </button>
        </div>
    </div>

    <script>
        let processedZip = null;

        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                document.getElementById('apiKey').value = savedKey;
                loadUserModels();
            }

            const savedSitemaps = localStorage.getItem('saved_sitemaps');
            if (savedSitemaps) document.getElementById('sitemapUrls').value = savedSitemaps;
        });

        async function loadUserModels() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const modelSelect = document.getElementById('modelSelect');
            const modelStatus = document.getElementById('modelStatus');
            if (!apiKey) return;

            modelStatus.innerText = "⏳ جاري فحص النماذج المتاحة في حسابك...";

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
                if (!res.ok) throw new Error("تعذر جلب النماذج.");
                
                const data = await res.json();
                if (data.models && data.models.length > 0) {
                    const textModels = data.models.filter(m => 
                        m.supportedGenerationMethods && 
                        m.supportedGenerationMethods.includes("generateContent")
                    );

                    if (textModels.length > 0) {
                        modelSelect.innerHTML = "";
                        textModels.forEach(m => {
                            const opt = document.createElement("option");
                            opt.value = m.name;
                            opt.innerText = m.displayName ? `${m.displayName} (${m.name})` : m.name;
                            if (m.name.includes("3.1-flash-lite") || m.name.includes("flash-lite")) {
                                opt.selected = true;
                            }
                            modelSelect.appendChild(opt);
                        });
                        modelStatus.innerText = `✅ تم تحديث قائمة النماذج.`;
                        return;
                    }
                }
            } catch (err) {
                modelStatus.innerText = "يعمل بالوضع الافتراضي: models/gemini-3.1-flash-lite";
            }
        }

        document.getElementById('articleFiles').addEventListener('change', (e) => {
            const count = e.target.files.length;
            document.getElementById('fileCount').innerText = count > 0 ? `تم اختيار ${count} ملف.` : "لم يتم اختيار أي ملفات.";
        });

        async function fetchXmlWithProxy(url) {
            const proxies = [
                (u) => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
                (u) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
                (u) => `https://corsproxy.io/?url=${encodeURIComponent(u)}`
            ];

            for (let proxy of proxies) {
                try {
                    const res = await fetch(proxy(url.trim()));
                    if (res.ok) {
                        const text = await res.text();
                        if (text && text.includes('<')) return text;
                    }
                } catch (e) { continue; }
            }
            return null;
        }

        // سحب كامل روابط المتجر دون استثناء
        async function extractUrlsFromSitemap(sitemapUrl) {
            const xmlText = await fetchXmlWithProxy(sitemapUrl);
            if (!xmlText) return [];

            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlText, "text/xml");
            const locElements = xmlDoc.getElementsByTagName("loc");
            
            let urls = [];
            let subSitemaps = [];

            for (let i = 0; i < locElements.length; i++) {
                let link = locElements[i].textContent.trim();
                if (link.endsWith('.xml')) subSitemaps.push(link);
                else urls.push(link);
            }

            // إذا كانت خريطة رئيسية، نقرأ جميع الخرائط الفرعية كاملة
            if (urls.length === 0 && subSitemaps.length > 0) {
                let allSubUrls = [];
                for (let sub of subSitemaps) {
                    const res = await extractUrlsFromSitemap(sub);
                    allSubUrls = allSubUrls.concat(res);
                }
                return allSubUrls;
            }

            return urls;
        }

        const sleep = ms => new Promise(r => setTimeout(r, ms));

        async function getSemanticLinksMapping(modelEndpoint, articleText, urls) {
            const readableUrls = urls.map(u => {
                try {
                    const decoded = decodeURI(u);
                    const slug = decoded.split('/').filter(Boolean).pop().replace(/[-_]/g, ' ');
                    return `"${slug}" <===> (${u})`;
                } catch (e) {
                    return u;
                }
            }).join('\n');

            const prompt = `أنت خبير محترف في هندسة الروابط الداخلية لمواقع التجارة الإلكترونية (Internal SEO).

المهمة:
اختر من (1 إلى 3 روابط) من قائمة روابط المتجر المرفقة والتي ترتبط ارتباطاً وثيقاً بموضوع ومحتوى المقال، وحدد العبارات المطابقة لها من المقال.

قواعد هامة ومرنة:
1. **طول نص الرابط (من كلمتين إلى 5 كلمات):**
   - اختر عبارة طبيعية وسياقية من (2 إلى 5 كلمات).
   - ✔️ أمثلة مقبولة جداً: "العود المروكي"، "المروكي المحسن"، "خشب العود المروكي"، "أفضل أنواع العود المروكي".
   - ❌ ممنوع الكلمة الواحدة المعزولة مثل ("عود" فقط أو "هنا").
2. **مطابقة تامة للنص الأصلي:**
   - انسخ العبارة في "exact_text" كما هي موجودة تماماً في نص المقال دون أي تحريف.
3. **أولوية المنتجات:**
   - يفضل دائماً توجيه القارئ لصفحات المنتجات والتصنيفات بدلاً من المقالات العامة متى ما توفرت.

أرجع النتيجة حصراً بصيغة JSON Array بدون أي شرح أو كلام إضافي:
[
  {
    "exact_text": "العبارة المنسوخة من المقال (كلمتان فأكثر)",
    "url": "رابط الصفحة المطابقة"
  }
]

قائمة روابط المتجر المتاحة:
${readableUrls}

نص المقال:
${articleText}`;

            const response = await fetch(modelEndpoint, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: { temperature: 0.2 }
                })
            });

            const data = await response.json();
            if (data.error) throw new Error(data.error.message);

            let raw = data.candidates[0].content.parts[0].text.trim();
            raw = raw.replace(/^```json\s*/i, '').replace(/^```\s*/, '').replace(/\s*```$/, '');
            
            try {
                return JSON.parse(raw);
            } catch (e) {
                return [];
            }
        }

        function buildArabicFuzzyRegex(phrase) {
            let clean = phrase
                .replace(/[\u064B-\u065F\u0670\u0640]/g, '')
                .replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

            clean = clean
                .replace(/[اأإآ]/g, '[اأإآ]')
                .replace(/[هة]/g, '[هة]')
                .replace(/[يى]/g, '[يى]')
                .replace(/\s+/g, '\\s+');

            return new RegExp(clean, 'i');
        }

        function injectLinksIntoOriginalText(originalText, linksArray, fileName) {
            let resultText = originalText;
            const reportList = document.getElementById('injectedReport');

            if (!Array.isArray(linksArray) || linksArray.length === 0) {
                const li = document.createElement('li');
                li.innerText = `⚠️ ${fileName}: لم يقترح الذكاء الاصطناعي أي روابط مطابقة.`;
                reportList.appendChild(li);
                return originalText;
            }

            let injectedCount = 0;
            const items = linksArray.slice(0, 3);

            for (const item of items) {
                let phrase = item.exact_text ? item.exact_text.trim() : null;
                let link = item.url ? item.url.trim() : null;

                if (link && link.includes('<===>')) {
                    link = link.split('<===>')[1].replace(/[()]/g, '').trim();
                }

                if (phrase && link) {
                    phrase = phrase.replace(/^[«"'\s]+|[»"'\s.,:;،؟!-]+$/g, '').trim();

                    // السماح بالعبارات المكونة من كلمتين فأكثر
                    const wordCount = phrase.split(/\s+/).filter(Boolean).length;
                    if (wordCount < 2) continue;

                    // 1. المطابقة المباشرة
                    if (resultText.includes(phrase) && !resultText.includes(`[${phrase}]`)) {
                        resultText = resultText.replace(phrase, `[${phrase}](${link})`);
                        injectedCount++;

                        const li = document.createElement('li');
                        li.innerHTML = `✅ <b>${fileName}</b>: تم ربط <i>"${phrase}"</i> 👈 <a href="${link}" target="_blank" class="text-blue-600 underline">${decodeURI(link)}</a>`;
                        reportList.appendChild(li);
                        continue;
                    }

                    // 2. المطابقة المرنة (الهمزات والحروف)
                    const fuzzyRegex = buildArabicFuzzyRegex(phrase);
                    const match = resultText.match(fuzzyRegex);

                    if (match && match[0] && !resultText.includes(`[${match[0]}]`)) {
                        const originalWordInDoc = match[0];
                        resultText = resultText.replace(originalWordInDoc, `[${originalWordInDoc}](${link})`);
                        injectedCount++;

                        const li = document.createElement('li');
                        li.innerHTML = `✅ <b>${fileName}</b>: تم ربط <i>"${originalWordInDoc}"</i> (مطابقة ذكية) 👈 <a href="${link}" target="_blank" class="text-blue-600 underline">${decodeURI(link)}</a>`;
                        reportList.appendChild(li);
                    }
                }
            }

            if (injectedCount === 0) {
                const suggested = items.map(i => i.exact_text).join(' ، ');
                const li = document.createElement('li');
                li.innerHTML = `⚠️ <b>${fileName}</b>: اقترح الموديل: [${suggested}] ولكن تعذرت مطابقتها مع النص.`;
                reportList.appendChild(li);
            }

            return resultText;
        }

        async function startBatchProcessing() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const sitemapUrlsInput = document.getElementById('sitemapUrls').value.trim();
            const fileInput = document.getElementById('articleFiles');
            const files = fileInput.files;

            const submitBtn = document.getElementById('submitBtn');
            const statusContainer = document.getElementById('statusContainer');
            const downloadContainer = document.getElementById('downloadContainer');
            const statusText = document.getElementById('statusText');
            const progressPercent = document.getElementById('progressPercent');
            const progressBar = document.getElementById('progressBar');
            const logMessage = document.getElementById('logMessage');
            const reportList = document.getElementById('injectedReport');

            if (!apiKey) return alert("يرجى إدخال مفتاح Google AI Studio API Key.");
            if (!sitemapUrlsInput) return alert("يرجى إدخال رابط خريطة موقع (Sitemap) واحد على الأقل.");
            if (!files || files.length === 0) return alert("يرجى اختيار ملف مقال (.txt) واحد على الأقل.");

            localStorage.setItem('gemini_api_key', apiKey);
            localStorage.setItem('saved_sitemaps', sitemapUrlsInput);

            let selectedModel = document.getElementById('modelSelect').value || "models/gemini-3.1-flash-lite";
            if (!selectedModel.startsWith('models/')) selectedModel = 'models/' + selectedModel;

            submitBtn.disabled = true;
            statusContainer.classList.remove('hidden');
            downloadContainer.classList.add('hidden');
            reportList.innerHTML = "";
            
            progressBar.style.width = '0%';
            progressPercent.innerText = '0%';
            statusText.innerText = "⏳ جاري استخراج روابط المتجر من الـ Sitemap...";
            logMessage.innerText = "";

            try {
                const sitemapList = sitemapUrlsInput.split('\n').map(s => s.trim()).filter(s => s.startsWith('http'));
                let allUrls = [];
                for (let sitemap of sitemapList) {
                    const fetchedUrls = await extractUrlsFromSitemap(sitemap);
                    allUrls = allUrls.concat(fetchedUrls);
                }
                allUrls = [...new Set(allUrls)];

                if (allUrls.length === 0) throw new Error("تعذر سحب أي روابط من خريطة الموقع. تأكد أن الرابط يعمل بشكل صحيح.");

                // إرسال عينة حتى 500 رابط كاملة دون أي حذف
                const selectedUrls = allUrls.slice(0, 500);

                const countNotice = document.createElement('li');
                countNotice.innerHTML = `📊 <b>تم استخراج (${allUrls.length}) رابط بنجاح من متجرك.</b> جاري فحص المقالات...`;
                countNotice.className = "text-blue-700 font-bold mb-2 pb-1 border-b";
                reportList.appendChild(countNotice);

                const geminiEndpoint = `https://generativelanguage.googleapis.com/v1beta/${selectedModel}:generateContent?key=${apiKey}`;

                const zip = new JSZip();
                const totalFiles = files.length;

                for (let i = 0; i < totalFiles; i++) {
                    const file = files[i];
                    const currentNum = i + 1;
                    
                    statusText.innerText = `🔍 فحص وحقن المقال (${currentNum} من ${totalFiles}): ${file.name}`;
                    logMessage.innerText = `جاري التحليل والمطابقة...`;

                    const originalText = await file.text();
                    const linksMapping = await getSemanticLinksMapping(geminiEndpoint, originalText, selectedUrls);
                    const updatedContent = injectLinksIntoOriginalText(originalText, linksMapping, file.name);
                    
                    zip.file(file.name, updatedContent);

                    const pct = Math.round((currentNum / totalFiles) * 100);
                    progressBar.style.width = `${pct}%`;
                    progressPercent.innerText = `${pct}%`;

                    if (i < totalFiles - 1) await sleep(1200);
                }

                processedZip = zip;
                statusText.innerText = "✅ تم الانتهاء بنجاح!";
                logMessage.innerText = `اكتملت معالجة جميع المقالات بنجاح.`;
                downloadContainer.classList.remove('hidden');

            } catch (err) {
                alert("❌ حدث خطأ: " + err.message);
                statusText.innerText = "توقفت العملية بسبب خطأ.";
            } finally {
                submitBtn.disabled = false;
            }
        }

        async function downloadZip() {
            if (!processedZip) return;
            const content = await processedZip.generateAsync({ type: "blob" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(content);
            link.download = "internal_linked_articles.zip";
            link.click();
        }
    </script>
</body>
</html>
