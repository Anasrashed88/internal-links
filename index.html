<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة توليد الروابط الداخلية (SEO - Gemini)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 p-4 md:p-8">
    <div class="max-w-3xl mx-auto bg-white p-6 md:p-8 rounded-xl shadow-md">
        <h1 class="text-2xl font-bold mb-6 text-center text-blue-700">🔗 مُوَلّد الروابط الداخلية لمحركات البحث (Gemini AI)</h1>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-semibold mb-1">مفتاح Google AI Studio API Key:</label>
                <input type="password" id="apiKey" placeholder="AIzaSy..." class="w-full border p-2 rounded focus:outline-blue-500 font-mono text-sm">
                <span class="text-xs text-gray-500">يُحفظ بأمان في متصفحك تلقائياً.</span>
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1">🗺️ روابط خرائط الموقع (Sitemaps):</label>
                <textarea id="sitemapUrls" rows="3" placeholder="ضع رابط خريطة المنتجات أو الأقسام هنا:&#10;https://example.com/sitemap_products_1.xml" class="w-full border p-2 rounded focus:outline-blue-500 font-mono text-sm"></textarea>
            </div>

            <div>
                <label class="block text-sm font-semibold mb-1">📝 نص المقالة:</label>
                <textarea id="articleText" rows="6" placeholder="الصق نص المقالة هنا..." class="w-full border p-2 rounded focus:outline-blue-500"></textarea>
            </div>

            <button onclick="processInternalLinks()" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition duration-200">
                🚀 معالجة وتوليد الروابط
            </button>
        </div>

        <div id="status" class="mt-4 p-3 rounded-lg text-center font-medium hidden"></div>

        <div id="resultContainer" class="mt-6 hidden">
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-lg font-bold">النتيجة بعد إضافة الروابط:</h2>
                <button onclick="copyResult()" class="text-sm bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded">📋 نسخ المقال</button>
            </div>
            <textarea id="resultText" rows="8" class="w-full border p-3 rounded bg-gray-50 focus:outline-none font-mono text-sm" readonly></textarea>
        </div>
    </div>

    <script>
        const HARDCODED_API_KEY = "";

        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) document.getElementById('apiKey').value = savedKey;

            const savedSitemaps = localStorage.getItem('saved_sitemaps');
            if (savedSitemaps) document.getElementById('sitemapUrls').value = savedSitemaps;
        });

        async function fetchXmlWithProxy(url) {
            const proxies = [
                (u) => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
                (u) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
                (u) => `https://corsproxy.io/?url=${encodeURIComponent(u)}`
            ];

            for (let proxy of proxies) {
                try {
                    const res = await fetch(proxy(url.trim()));
                    if (res.ok) {
                        const text = await res.text();
                        if (text && text.includes('<')) return text;
                    }
                } catch (e) {
                    continue;
                }
            }
            return null;
        }

        async function extractUrlsFromSitemap(sitemapUrl) {
            const xmlText = await fetchXmlWithProxy(sitemapUrl);
            if (!xmlText) return [];

            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlText, "text/xml");
            const locElements = xmlDoc.getElementsByTagName("loc");
            
            let urls = [];
            let subSitemaps = [];

            for (let i = 0; i < locElements.length; i++) {
                let link = locElements[i].textContent.trim();
                if (link.endsWith('.xml')) {
                    subSitemaps.push(link);
                } else {
                    urls.push(link);
                }
            }

            if (urls.length === 0 && subSitemaps.length > 0) {
                const targetSub = subSitemaps.find(s => s.includes('product') || s.includes('category')) || subSitemaps[0];
                return await extractUrlsFromSitemap(targetSub);
            }

            return urls;
        }

        // دالة لاكتشاف أحدث نموذج متاح تلقائياً لحسابك
        async function getBestAvailableModel(apiKey) {
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
                if (res.ok) {
                    const data = await res.json();
                    if (data.models && data.models.length > 0) {
                        // البحث عن نموذج flash فعال
                        const flashModel = data.models.find(m => 
                            m.supportedGenerationMethods && 
                            m.supportedGenerationMethods.includes("generateContent") && 
                            m.name.includes("flash")
                        );
                        if (flashModel) return flashModel.name;

                        // أو أي نموذج gemini فعال
                        const anyGemini = data.models.find(m => 
                            m.supportedGenerationMethods && 
                            m.supportedGenerationMethods.includes("generateContent") && 
                            m.name.includes("gemini")
                        );
                        if (anyGemini) return anyGemini.name;
                    }
                }
            } catch (e) {
                console.warn("Could not list models, falling back to default.", e);
            }
            // اختيار افتراضي حديث في حال تعذر جلب القائمة
            return "models/gemini-2.5-flash";
        }

        async function processInternalLinks() {
            const apiKeyInput = document.getElementById('apiKey').value.trim();
            const apiKey = HARDCODED_API_KEY.trim() !== "" ? HARDCODED_API_KEY : apiKeyInput;
            const sitemapUrlsInput = document.getElementById('sitemapUrls').value.trim();
            const articleText = document.getElementById('articleText').value.trim();
            
            const submitBtn = document.getElementById('submitBtn');
            const resultContainer = document.getElementById('resultContainer');
            const resultText = document.getElementById('resultText');

            if (!apiKey) {
                showStatus("يرجى إدخال مفتاح Gemini API Key.", "red");
                return;
            }
            if (!sitemapUrlsInput) {
                showStatus("يرجى إدخال رابط خريطة موقع (Sitemap) واحد على الأقل.", "red");
                return;
            }
            if (!articleText) {
                showStatus("يرجى إدخال نص المقالة.", "red");
                return;
            }

            localStorage.setItem('gemini_api_key', apiKey);
            localStorage.setItem('saved_sitemaps', sitemapUrlsInput);

            showStatus("⏳ جاري استخراج الروابط من خريطة الموقع...", "blue");
            submitBtn.disabled = true;

            try {
                const sitemapList = sitemapUrlsInput.split('\n').map(s => s.trim()).filter(s => s.startsWith('http'));
                
                if (sitemapList.length === 0) {
                    throw new Error("تأكد أن رابط الخريطة يبدأ بـ https:// أو http://");
                }

                let allUrls = [];
                for (let sitemap of sitemapList) {
                    const fetchedUrls = await extractUrlsFromSitemap(sitemap);
                    allUrls = allUrls.concat(fetchedUrls);
                }

                allUrls = [...new Set(allUrls)];

                if (allUrls.length === 0) {
                    throw new Error("تعذر سحب أي روابط من خريطة الموقع المُدخلة. تأكد من صحة الرابط.");
                }

                const selectedUrls = allUrls.slice(0, 70);

                showStatus("🔍 جاري فحص أحدث نموذج ذكاء اصطناعي متاح في حسابك...", "blue");
                const activeModel = await getBestAvailableModel(apiKey);

                showStatus(`🧠 تم ربط (${allUrls.length}) صفحة بنجاح! جاري الدمج عبر ${activeModel.replace('models/', '')}...`, "blue");

                const prompt = `أنت خبير محترف في تحسين محركات البحث وتنسيق الروابط الداخلية (Internal SEO Specialist).

المهمة:
- أمامك قائمة بروابط صفحات وتصنيفات المتجر.
- وأمامك نص مقالة.
- اختر أنسب الروابط (بحد أقصى 3 روابط فقط) التي تتطابق تماماً مع سياق المقال وموضوعه.
- أدرج الروابط داخل النص بشكل Markdown طبيعي مثل: [الكلمة المفتاحية](الرابط).
- شروط الـ SEO: 
  1. اجعل نص الرابط (Anchor text) طبيعياً جداً ضمن سياق الجملة، وتجنب كلمات مثل "اضغط هنا" أو "شاهد هذا".
  2. وزع الروابط على فقرات مختلفة ولا تجمعها في نفس الفقرة.
- أرجع نص المقالة بالكامل بعد دمج الروابط بدون إضافة أي ملاحظات أو مقدمات من قبلك.

قائمة الروابط المتاحة:
${selectedUrls.join('\n')}

المقال:
${articleText}`;

                const geminiUrl = `https://generativelanguage.googleapis.com/v1beta/${activeModel}:generateContent?key=${apiKey}`;

                const response = await fetch(geminiUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: { temperature: 0.3 }
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(`خطأ من Google: ${data.error.message}`);
                }

                resultText.value = data.candidates[0].content.parts[0].text;
                resultContainer.classList.remove('hidden');
                showStatus(`✅ تم دمج الروابط بنجاح!`, "green");

            } catch (err) {
                showStatus("❌ " + err.message, "red");
            } finally {
                submitBtn.disabled = false;
            }
        }

        function showStatus(text, color) {
            const status = document.getElementById('status');
            status.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-blue-100', 'text-blue-700', 'bg-green-100', 'text-green-700');
            if (color === "red") status.classList.add('bg-red-100', 'text-red-700');
            else if (color === "green") status.classList.add('bg-green-100', 'text-green-700');
            else status.classList.add('bg-blue-100', 'text-blue-700');
            status.innerText = text;
        }

        function copyResult() {
            const text = document.getElementById('resultText');
            text.select();
            navigator.clipboard.writeText(text.value);
            alert("تم نسخ المقال بنجاح!");
        }
    </script>
</body>
</html>
